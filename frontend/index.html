<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherGPT</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 600px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { color: #00d4ff; text-align: center; margin-bottom: 10px; }
        p.sub { color: #aaa; text-align: center; margin-bottom: 25px; }
        .chat-box {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
        }
        .msg { margin-bottom: 12px; }
        .msg.user span {
            background: #0f3460;
            color: white;
            padding: 8px 14px;
            border-radius: 18px 18px 0 18px;
            display: inline-block;
        }
        .msg.bot span {
            background: #00d4ff22;
            color: #00d4ff;
            padding: 8px 14px;
            border-radius: 18px 18px 18px 0;
            border: 1px solid #00d4ff44;
            display: inline-block;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 15px;
        }
        input::placeholder { color: #888; }
        button {
            padding: 12px 20px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        button::hover { background: #00b8d9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WeatherGPT</h1>
        <p class="sub">Ask me anything about the weather</p>
        <div class="chat-box" id="chatBox">
            <div class="msg bot">
                <span>Hello! Ask me about rain, temperature, storms or forecasts!</span>
            </div>
        </div>
        <div class="input-row">
            <input type="text" id="userInput"
                   placeholder="e.g. will it rain tomorrow?"
                   onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Ask</button>
        </div>
    </div>

    <script>
        const API = 'http://127.0.0.1:8000';

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const box = document.getElementById('chatBox');
            const q = input.value.trim();
            if (!q) return;

            box.innerHTML += `<div class="msg user"><span>${q}</span></div>`;
            input.value = '';

            try {
                const res = await fetch(`${API}/ask?question=${encodeURIComponent(q)}`);
                const data = await res.json();
                const reply = `Detected intent: ${data.intent.replace('_', ' ')}`;
                box.innerHTML += `<div class="msg bot"><span>${reply}</span></div>`;
            } catch(e) {
                box.innerHTML += `<div class="msg bot"><span>Error: API not running!</span></div>`;
            }

            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
